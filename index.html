<!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Background Slider</title>
            <link rel="stylesheet" href="main.css">
        </head>
        <body>
            <h1>Background sliders</h1>

        <div class="slidercontainerR">
            <input type="range" min="0" max="255" value="128" class="sliderR" id="myRangeR">
            <p>Value: <span id="demoR"></span></p>
        </div>

        <div class="slidercontainerG">
            <input type="range" min="0" max="255" value="128" class="sliderG" id="myRangeG">
            <p>Value: <span id="demoG"></span></p>
        </div>

        <div class="slidercontainerB">
            <input type="range" min="0" max="255" value="128" class="sliderB" id="myRangeB">
            <p>Value: <span id="demoB"></span> </p>
        </div>

        <p class="endText">Essentially three RGB sliders that can change the background colour!</p>

        <script src="script.js"></script>
        </body>
    </html>
